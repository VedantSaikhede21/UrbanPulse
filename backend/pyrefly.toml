# Pyrefly configuration for the UrbanPulse backend.
# Invoked as `pyrefly check .` from backend/ (see CI), so the project
# root here is backend/ itself: search-path ["."] resolves `app.main`
# (lives at backend/app/main.py). No python-interpreter-path pinned —
# CI passes the requirements-installed interpreter explicitly and
# local devs can point at their own venv via the same CLI flag.
search-path = ["."]
