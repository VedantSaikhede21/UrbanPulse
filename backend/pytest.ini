[pytest]
# Bare `pytest` (as CI runs it) does not put cwd on sys.path, so
# `from app...` imports fail at collection. `python -m pytest` works
# around it, but the config must be correct on its own.
pythonpath = .
markers =
    integration: requires external services (Docker, network, live DB). Opt in with RUN_DB_TESTS=1.
