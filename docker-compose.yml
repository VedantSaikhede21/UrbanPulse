name: urbanpulse

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: urbanpulse-backend
    env_file:
      - .env
    environment:
      # Production by default; set ENV=development in .env for offline demos
      # (dev mode allows unsigned JWTs and demo seed endpoints).
      - ENV=${ENV:-production}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped
    stop_grace_period: 20s
    networks:
      - urbanpulse-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/health/ready"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # VITE_* vars are baked into the bundle at BUILD time.
        # Values come from the root .env (single source of truth).
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: urbanpulse-frontend
    depends_on:
      # service_started (not service_healthy): if the DB is slow, the
      # static landing page still comes up instead of a dead nginx.
      backend:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-80}:80"
    restart: unless-stopped
    networks:
      - urbanpulse-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # ARQ worker (Phase 2.1). Runs the AI triage graph off the
  # web worker's request thread. Same image as the backend, but
  # `arq` instead of `uvicorn`. The same REDIS_URL env var that
  # the rate-limiter reads is what arq uses for the job queue —
  # one Redis, two consumers. No port; arq has its own health
  # ping inside the worker loop. depends_on the backend so the
  # worker doesn't race the backend on first boot; it will retry
  # the job if the backend hasn't loaded graphs yet (see
  # queue.triage_ticket's RuntimeError → Retry).
  #
  # The worker only runs when redis is enabled (--profile redis)
  # or when REDIS_URL points at an external Redis. Without a
  # reachable Redis the worker would crash-loop, which is a
  # worse failure mode than the worker simply not existing.
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: urbanpulse-worker
    profiles: ["redis"]   # opt-in: matches the redis service profile
    env_file:
      - .env
    environment:
      - ENV=${ENV:-production}
    command: ["arq", "app.queue.WorkerSettings"]
    volumes:
      - backups_data:/app/backups
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - urbanpulse-net
    depends_on:
      - backend

  # Optional: local PostGIS database for fully offline demos.
  # Enable with: docker compose --profile local-db up --build
  # Then override DATABASE_URL in .env to:
  #   DATABASE_URL=postgresql://postgres:postgres@db:5432/postgres
  db:
    image: postgis/postgis:16-3.4
    profiles: ["local-db"]
    container_name: urbanpulse-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - urbanpulse-net

  # Optional: local Redis for offline demos. Phase 2.1 (ARQ
  # worker) needs a Redis for the job queue; Phase 0's rate
  # limiter also keys off REDIS_URL when set. Enable with
  #   docker compose --profile redis up --build
  # and put REDIS_URL=redis://redis:6379/0 in .env.
  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    container_name: urbanpulse-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - urbanpulse-net

volumes:
  uploads_data:
  db_data:
  backups_data:
  redis_data:

networks:
  urbanpulse-net:
    driver: bridge
    # Supabase's database host publishes an IPv6 (AAAA) record only.
    # Enable IPv6 on the bridge so the backend container can reach it;
    # Docker NATs IPv6 outbound traffic through the host's IPv6 route.
    # fd00::/8 is RFC 4193 Unique Local Addressing — safe for any LAN/host,
    # unlike the 2001:db8::/32 documentation range.
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd00:20::/64
