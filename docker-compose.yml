services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: urbanpulse-backend
    expose:
      - "8000"
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - ENV=production
    restart: unless-stopped
    networks:
      - urbanpulse-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: urbanpulse-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=http://localhost:8000
    restart: unless-stopped
    networks:
      - urbanpulse-net

networks:
  urbanpulse-net:
    driver: bridge
